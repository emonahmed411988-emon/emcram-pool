name: Build Android APK & Publish Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK packages (API 34)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install dependencies & build web bundle
        run: |
          npm ci
          npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare downloadable APK
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/CarromPool-Android.apk

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarromPool-Android-APK
          path: release-apk/CarromPool-Android.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: Carrom Pool Android APK (Build #${{ github.run_number }})
          body: |
            ## Carrom Pool — Android APK Download
            Download **`CarromPool-Android.apk`** below and install it on your Android phone!

            ### Features Included
            - **3 Game Modes**: Play Disc Pool (6/9 pieces), Play Carrom (with Red Queen & Cover rules), Play Freestyle (Points Race)
            - **Iconic Stages**: Paris Stage, Delhi Lounge, Cairo Club, New York Arena, Singapore Hall, Mumbai Club, Dubai Palace, Tokyo Dojo
            - **2D Realistic Physics Engine**: Slingshot aiming ring, power arrow, dotted trajectory preview, baseline slider, wood-grain board, procedural audio
            - **Account System**: Instant Guest login + Full Account Creation / Sign In / Avatar Selection / Stats
            - **Equipment & Upgrades**: Blaze, Astro, Pulse, Aura, Trace, Toran strikers + Powers, Pucks, Trails, Pockets & Collection Power
            - **Friends & Private Rooms**: 1v1 & 2v2 Private Rooms with shareable Room Codes (online Socket.IO + offline Bot / Pass-n-Play)
            - **Chests, Lucky Shot, Spin & Win, Free Daily Rewards, Events, Leaderboards & Shop**
          files: release-apk/CarromPool-Android.apk
